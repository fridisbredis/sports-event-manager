name: "Prod Health Check: /api/health Availability Probe"

on:
  workflow_dispatch: # also allow manual trigger from GitHub UI
  schedule:
    # This repo is public (unauthenticated api.github.com calls return 200),
    # so scheduled Actions minutes are free here -- a `*/5` interval costs
    # nothing. Do not tighten this to save minutes; it isn't spending any.
    - cron: '*/5 * * * *'

jobs:
  health-check:
    name: Probe /api/health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Curl /api/health three times
        env:
          # Assigned to an env var (rather than interpolating
          # ${{ secrets.PROD_APP_URL }} directly into the shell body) so the
          # guard below can check it and so a missing/renamed secret produces
          # a distinct, self-describing failure instead of curl silently
          # receiving "/api/health" as its URL and failing in a way that
          # looks identical to a real outage.
          URL: ${{ secrets.PROD_APP_URL }}
        run: |
          # Deliberately targets /api/health (DB-backed), NOT /api/health/live.
          # /api/health returns 503 when Supabase is unreachable, and that 503
          # passes through Azure ingress and is counted under
          # StatusCodeCategory = 5xx -- which feeds the 5xx metric alert
          # (threshold: count >= 2 within 15 minutes).
          #
          # Three curls per run means a single cron run can clear that
          # threshold on its own. GitHub Actions `*/5` schedules drift badly
          # in practice (5-15 minutes between runs is normal), so an alert
          # that needed two separate runs inside one 15-minute window would
          # be unreliable. Three curls decouples the alert from cron drift
          # entirely. This is also why the alert uses a count threshold
          # rather than a rate: on a low-traffic app a rate would be diluted
          # by healthy traffic.
          #
          # ${{ secrets.PROD_APP_URL }} is the Azure Container App URL.
          # Prod also serves a custom domain (app.viadalevent.se) which an
          # operator may prefer to target instead.
          #
          # If this job fails, what that means depends on how prod is
          # failing.
          #
          # For a partial failure -- app up, serving 5xx, DB unreachable,
          # /api/health returning 503 -- the Azure 5xx metric alert is
          # authoritative; this workflow's own notification is a secondary
          # signal only.
          #
          # For a total outage -- app stopped, revision never activates,
          # ingress broken -- this workflow is the primary and only signal.
          # All three Azure metric alerts are static-threshold metric
          # alerts, and a static-threshold alert with no incoming data does
          # not fire; it holds its previous state instead. In a total
          # outage: Requests records nothing, so the 5xx alert is silent;
          # Replicas sits at 0, so "min Replicas >= 3" is false and the
          # saturation alert is silent; RestartCount records nothing, so
          # the crash-loop alert is silent. Do not dismiss a failing run of
          # this job because the Azure alert did not also fire -- for a
          # total outage, it will not.
          #
          # Guard against an unset/renamed PROD_APP_URL secret before the
          # loop. Without this, curl would receive "/api/health" (empty URL
          # prefix) as its target, fail, and this job would go red in a way
          # indistinguishable from a real prod outage -- but per the "For a
          # total outage" note above, this job IS the primary and only
          # outage signal, so a config error masquerading as an outage is
          # more costly here than it would be elsewhere. Fail loudly and
          # distinctly instead.
          [ -n "$URL" ] || { echo "::error::PROD_APP_URL secret is not set"; exit 1; }

          # Each curl below must be non-fatal on its own. GitHub Actions
          # runs `run:` steps under `bash -e`, which aborts the whole step
          # the moment any command in it exits non-zero -- including a
          # `curl --fail` inside this loop's body. Left as `curl ... ` with
          # no `|| ...`, only the FIRST failing request would ever run; the
          # other two would never execute, and only one 5xx would reach the
          # Azure metric -- exactly the scenario the "Three curls per run"
          # comment above says this loop exists to avoid. So: catch each
          # failure into a counter instead of letting it kill the step, keep
          # `--fail` so a 5xx still counts as a failure, and only fail the
          # step (via exit 1) after all three attempts have run.
          failures=0
          for i in 1 2 3; do
            curl --fail --silent --show-error --max-time 10 "$URL/api/health" || failures=$((failures + 1))
          done
          [ "$failures" -eq 0 ] || { echo "::error::$failures/3 probes failed"; exit 1; }
