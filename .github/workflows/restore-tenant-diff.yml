name: 'Tenant restore preview (read-only)'

# N25 step 2. Shows what restoring ONE tenant from a weekly backup slot would
# change in live prod, table by table — and writes nothing to prod.
#
#   1. Starts a throwaway local Supabase stack on this runner.
#   2. Restores the chosen weekly slot into it (scripts/ops/restore-prod-db.sh,
#      whose prod guard refuses any prod target).
#   3. Compares the tenant's rows there with live prod
#      (scripts/ops/diff-tenant.sh). Prod is only read, inside READ ONLY
#      transactions, through PROD_DB_URL — the same credential the weekly
#      backup job already dumps the whole database with.
#   4. Stores the report in the private `restore-previews` container of the
#      prod snapshot storage account, as preview-<tenant-id>.json. The
#      system admin reads it on System admin -> Backups.
#
# THIS REPO IS PUBLIC, and so are its Actions runs: logs, summaries and
# artifacts. So nothing about the result goes to GitHub — no summary beyond
# "done", no artifact — the tenant id is masked in the logs, and the restore's
# own output (row counts of every prod table) is not printed.
#
# The restored copy holds real prod data, phone numbers included. It lives only
# on this runner's disk and is gone when the job ends. The report holds counts
# and ids, never values (see diff-tenant.sh).
#
# Restoring for real is step 3 of N25 and is not built. See
# docs/ops/backup-and-restore.md §6.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Weekly slot to restore from (see System admin → Backups for which week each holds)'
        required: true
        type: choice
        options: ['0', '1', '2', '3']
      tenant_id:
        description: 'Tenant id (uuid)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: restore-tenant-diff
  cancel-in-progress: false

jobs:
  preview:
    name: Restore slot ${{ inputs.slot }} locally and diff the tenant against prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check inputs
        run: |
          # Read from the event file, not through env: or an expression: GitHub
          # prints a step's env and script into the (public) log before the
          # step runs, which would show the id before the mask below exists.
          # Every later step's env is masked.
          TENANT_ID=$(jq -r '.inputs.tenant_id' "$GITHUB_EVENT_PATH")
          echo "::add-mask::${TENANT_ID}"
          # Interpolated into SQL by diff-tenant.sh, which checks it too.
          if ! [[ "$TENANT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::tenant_id must be a lowercase uuid"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Same pin as quality.yml and weekly-db-backup.yml.
          version: 2.116.0

      - name: Read the slot's week from its metadata
        id: meta
        env:
          BLOB_CONN_STR: ${{ secrets.PROD_BLOB_CONNECTION_STRING }}
          SLOT: ${{ inputs.slot }}
        run: |
          META=$(az storage blob metadata show \
            --connection-string "$BLOB_CONN_STR" \
            --container-name db-snapshots \
            --name "weekly-slot-${SLOT}.tar.gz" \
            --query "[isoweek, capturedat]" --output tsv | paste -sd' ' -)
          read -r WEEK CAPTURED <<<"$META"
          echo "label=${SLOT} (ISO week ${WEEK:-?}, captured ${CAPTURED:-?})" >> "$GITHUB_OUTPUT"
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          echo "Slot ${SLOT}: ISO week ${WEEK:-?}, captured ${CAPTURED:-?}"

      - name: Start a throwaway local Supabase stack
        env:
          # config.toml reads the Twilio token through env(); its value is
          # irrelevant here (see quality.yml).
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: dummy
        run: supabase start

      - name: Restore the slot into the local stack
        env:
          BLOB_CONN_STR: ${{ secrets.PROD_BLOB_CONNECTION_STRING }}
          RESTORE_CONFIRM: restore
          SLOT: ${{ inputs.slot }}
        run: |
          # stdout carries psql's "COPY <n>" for every prod table; not for a
          # public log. Errors and the auth/storage fitting report are stderr.
          scripts/ops/restore-prod-db.sh "weekly-slot-${SLOT}.tar.gz" \
            "postgresql://postgres:postgres@127.0.0.1:54322/postgres" >/dev/null
          # The script copies the archive's Storage files into the workspace
          # for a human to upload by hand. Nobody does that here.
          rm -rf restored-storage-*

      - name: Diff the tenant against live prod (read-only)
        env:
          LIVE_DB_URL: ${{ secrets.PROD_DB_URL }}
          TENANT_ID: ${{ inputs.tenant_id }}
          DIFF_SLOT: ${{ steps.meta.outputs.label }}
        run: |
          [ -n "$LIVE_DB_URL" ] || { echo "::error::PROD_DB_URL secret is not set"; exit 1; }
          scripts/ops/diff-tenant.sh \
            "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            "$LIVE_DB_URL" "$TENANT_ID" report >/dev/null

      - name: Store the report where the Backups page reads it
        env:
          BLOB_CONN_STR: ${{ secrets.PROD_BLOB_CONNECTION_STRING }}
          TENANT_ID: ${{ inputs.tenant_id }}
          SLOT: ${{ inputs.slot }}
          WEEK: ${{ steps.meta.outputs.week }}
        run: |
          # Private container (created on the first run; a no-op after), one
          # blob per tenant, replaced by the next run: the newest preview is the
          # one that matters, and keeping old ones would only keep ids around.
          az storage container create --connection-string "$BLOB_CONN_STR" \
            --name restore-previews --public-access off --only-show-errors >/dev/null
          az storage blob upload --connection-string "$BLOB_CONN_STR" \
            --container-name restore-previews \
            --name "preview-${TENANT_ID}.json" \
            --file report/report.json \
            --content-type application/json \
            --overwrite --only-show-errors >/dev/null
          az storage blob metadata update --connection-string "$BLOB_CONN_STR" \
            --container-name restore-previews \
            --name "preview-${TENANT_ID}.json" \
            --metadata "slot=${SLOT}" "isoweek=${WEEK}" "generatedat=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --only-show-errors >/dev/null
          rm -rf report

      - name: Summary
        run: |
          echo "Preview stored. Open it in the app: System admin → Backups." >> "$GITHUB_STEP_SUMMARY"
