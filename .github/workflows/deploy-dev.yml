name: Deploy to dev

on:
  push:
    branches: [main]
  workflow_dispatch: # also allow manual trigger from GitHub UI

env:
  REGISTRY: ${{ secrets.REGISTRY_LOGIN_SERVER }}
  IMAGE_NAME: sports-event-manager
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Preview pending DB migrations (dev)
        run: |
          supabase link --project-ref lhflutwvwvzawzbcuwup
          supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply DB migrations (dev)
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate DB types
        run: npm run db:types

      - name: Fail if generated types are out of date
        run: |
          if ! git diff --quiet -- src/types/database.ts; then
            echo "src/types/database.ts is out of date. Run 'npm run db:types' locally and commit the result."
            git diff -- src/types/database.ts
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.DEV_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.DEV_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=development
            SENTRY_ORG=${{ secrets.DEV_SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.DEV_SENTRY_PROJECT }}
            SENTRY_AUTH_TOKEN=${{ secrets.DEV_SENTRY_AUTH_TOKEN }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image and env vars
        run: |
          az containerapp update \
            --name sports-event-manager-dev \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_DEV }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --set-env-vars \
              "NODE_ENV=production" \
              "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}" \
              "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.DEV_SUPABASE_ANON_KEY }}" \
              "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}" \
              "TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}" \
              "TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}" \
              "TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}" \
              "NEXT_PUBLIC_APP_URL=${{ secrets.DEV_APP_URL }}" \
              "SENTRY_DSN=${{ secrets.DEV_SENTRY_DSN }}" \
              "SENTRY_ENVIRONMENT=development" \
              "CRON_SECRET=${{ secrets.CRON_SECRET }}"

      - name: Verify deployment
        run: |
          az containerapp revision list \
            --name sports-event-manager-dev \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP_DEV }} \
            --output table
