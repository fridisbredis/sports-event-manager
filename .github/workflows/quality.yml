name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to match the version verified locally. `latest` drifts and
          # previously caused a version skew where `supabase status -o env`
          # returned a key format PostgREST rejected with a consistent 403.
          version: 2.95.4

      - name: Start local Supabase stack
        run: supabase start

      - name: Write .env.test.local from local Supabase status
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(SUPABASE_URL|SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            > .env.test.local

      - name: Wait for PostgREST to accept service-role queries
        run: |
          set -a
          source .env.test.local
          set +a
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/tenants?select=id&limit=1")
            if [ "$status" = "200" ]; then
              echo "PostgREST is ready (attempt $i)"
              exit 0
            fi
            echo "PostgREST not ready yet (attempt $i, status $status), retrying..."
            sleep 2
          done
          echo "PostgREST did not become ready in time"
          exit 1

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  migration-forward-fix:
    name: Migration forward-fix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the merge-base diff below can resolve.
          fetch-depth: 0

      - name: Check new migrations document a forward-fix plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Only ADDED files are checked (--diff-filter=A). Migrations
          # 0001-0032 predate this convention and are intentionally exempt
          # (see .claude/CLAUDE.md "Forward-fix plan") — editing one of them
          # must not start failing CI.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          else
            # push/workflow_dispatch: compare against the previous commit.
            base="HEAD^"
          fi

          new_migrations=$(git diff --name-only --diff-filter=A "$base" HEAD \
            -- 'supabase/migrations/*.sql')

          if [ -z "$new_migrations" ]; then
            echo "No new migrations in this change."
            exit 0
          fi

          missing=""
          for file in $new_migrations; do
            has_class=false
            has_window=false
            grep -qE '^--[[:space:]]*Forward-fix:[[:space:]]*(additive|destructive|replace)\b' "$file" \
              && has_class=true
            # Window: states what happens to the already-deployed code while the
            # new schema is live and the new image is not — see .claude/CLAUDE.md
            # "The ordering guarantee". Must say something, not just exist.
            grep -qE '^--[[:space:]]*Window:[[:space:]]*[^[:space:]<]' "$file" \
              && has_window=true

            if $has_class && $has_window; then
              echo "OK   $file"
            else
              $has_class || echo "FAIL $file — no valid 'Forward-fix:' class"
              $has_window || echo "FAIL $file — no filled-in 'Window:' line"
              missing="$missing $file"
            fi
          done

          if [ -n "$missing" ]; then
            cat <<'EOF'

          Every new migration must document a forward-fix plan in its SQL
          comment header. Add a block like:

            -- Forward-fix: additive
            --   Rollback: drop table if exists public.<table>;
            --   Data:     no data loss
            --   Blast:    <what breaks between the bad deploy and the fix>
            --   Window:   compatible

          The class must be one of: additive, destructive, replace.

          Window: is about DEPLOY ORDER, not about a bad migration. Schema is
          applied minutes before the new image ships (deploy-prod.yml step 1 vs
          step 4), so the migration has to be backward-compatible with the code
          already running. A new mandatory column without a default, or a
          rename/drop of a column a deployed page selects, is NOT safe in one
          release — split it expand/contract. "compatible" is a valid answer
          for most additive migrations; a placeholder in <angle brackets> is not.

          See .claude/CLAUDE.md -> "Forward-fix plan" and "The ordering
          guarantee" for the full convention.
          EOF
            echo "Missing forward-fix block:$missing"
            exit 1
          fi

  migration-number-collision:
    name: Migration number collision
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for duplicate migration number prefixes
        run: |
          set -euo pipefail

          # supabase db push matches migrations by their numeric prefix, not
          # filename. Two files sharing a prefix silently skip one as
          # "up to date" instead of erroring — this is what actually caused
          # F-REL-09 (see .claude/CLAUDE.md "db push matchar på nummer").
          cd supabase/migrations

          duplicates=$(ls -1 *.sql \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort | uniq -d)

          if [ -n "$duplicates" ]; then
            echo "Duplicate migration number prefixes found:"
            for num in $duplicates; do
              echo ""
              echo "  $num:"
              ls -1 "${num}"_*.sql | sed 's/^/    /'
            done
            echo ""
            echo "supabase db push matches migrations by numeric prefix, not filename."
            echo "A collision causes one migration to be silently skipped instead of applied."
            echo "Renumber the newer migration to a free prefix."
            exit 1
          fi

          echo "No migration number collisions."

  build:
    name: Production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build
        env:
          # Dummy values: NEXT_PUBLIC_* vars are inlined into the client
          # bundle at build time and must be present for prerender to
          # succeed (see F-MNT-07), but their real values are only needed
          # at runtime, not to verify the build itself.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
