name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to match the version verified locally. `latest` drifts and
          # previously caused a version skew where `supabase status -o env`
          # returned a key format PostgREST rejected with a consistent 403.
          # Bumped 2026-09-08: 2.95.4 predates `migration list
          # --output-format json`, which deploy-prod.yml's REL-04 snapshot
          # gate depends on — that flag only exists from v2.100.0 onward.
          version: 2.116.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Write .env.test.local from local Supabase status
        run: |
          supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(SUPABASE_URL|SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY)=' \
            > .env.test.local

      - name: Wait for PostgREST to accept service-role queries
        run: |
          set -a
          source .env.test.local
          set +a
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/tenants?select=id&limit=1")
            if [ "$status" = "200" ]; then
              echo "PostgREST is ready (attempt $i)"
              exit 0
            fi
            echo "PostgREST not ready yet (attempt $i, status $status), retrying..."
            sleep 2
          done
          echo "PostgREST did not become ready in time"
          exit 1

      - name: Run integration tests
        run: npm run test:integration

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  test-e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # The suite drives a real browser through sign-in and every screen; it is
    # the slowest job here by a wide margin, so it gets a ceiling well above
    # the ~2 min it takes locally without letting a hang burn a full hour.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only chromium: playwright.config.ts defines a single project, so
      # installing the other engines would add minutes of download for
      # browsers no test opens. --with-deps pulls the system libraries the
      # GitHub runner image does not ship.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # No .next cache step here, deliberately. The suite runs against `next
      # dev`, which compiles each route on first request, and that cost is real:
      # two thirds of a local run sits in the 17 tests that sign in, and the
      # three slowest take ~32s where two later ones running the same helper
      # take 1.1s, because by then the route is built.
      #
      # Caching Turbopack's dev tree does not recover it. Measured on this job:
      # 652s and 886s on cache misses against 716s on a hit — no better than the
      # spread between runners, while storing ~430 MB per entry against a 10 GB
      # repo ceiling that would start evicting the npm and Playwright caches.
      # (A first attempt cached .next/cache, which only `next build` writes, and
      # silently saved nothing; .next/dev/cache is the right path and still did
      # not help.)
      #
      # If this is worth another look, the lead is the compile itself — not
      # where its artifacts are stored.

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Same pin as the integration job above — see the note there on why
          # this is not `latest`.
          version: 2.116.0

      - name: Start local Supabase stack
        env:
          # config.toml reads the Twilio token through env() and `supabase
          # start` refuses to boot without it. Its value is irrelevant: the
          # seed numbers are intercepted by [auth.sms.test_otp] before Twilio
          # is ever called, which is what makes UI sign-in possible here.
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: dummy
        run: supabase start

      # Same gate as the integration job: `supabase start` returns before
      # PostgREST will accept service-role queries, and globalSetup's very
      # first act is a service-role read of `tenants`.
      - name: Wait for PostgREST to accept service-role queries
        run: |
          set -euo pipefail

          # Same extraction as the integration job: -o env with explicit
          # override names, rather than parsing the JSON shape, which has
          # changed between CLI versions before.
          eval "$(supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            | grep -E '^(SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY)=')"

          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              "${SUPABASE_URL}/rest/v1/tenants?select=id&limit=1")
            if [ "$status" = "200" ]; then
              echo "PostgREST is ready (attempt $i)"
              exit 0
            fi
            echo "PostgREST not ready yet (attempt $i, status $status), retrying..."
            sleep 2
          done
          echo "PostgREST did not become ready in time"
          exit 1

      # No seed step: tests/e2e/global-setup.ts runs `npm run seed:dev:local`
      # itself when the tenant is missing, which it always is on a fresh
      # runner. Seeding here as well would make the seed script throw — it
      # refuses to double an existing tenant, by design.
      #
      # No env pinning either: playwright.config.ts starts its own dev server
      # with NEXT_PUBLIC_SUPABASE_URL pointed at the local stack, and with
      # CI set, reuseExistingServer is false, so it cannot attach to anything
      # else. There is no .env.local on a runner for it to read.
      - name: Run E2E tests
        run: npm run test:e2e

      # The HTML report carries the trace and screenshot for every failure
      # (trace: 'retain-on-failure'), which is the only way to debug a CI-only
      # failure without reproducing it locally.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  migration-forward-fix:
    name: Migration forward-fix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the merge-base diff below can resolve.
          fetch-depth: 0

      - name: Check new migrations document a forward-fix plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Only ADDED files are checked (--diff-filter=A). Migrations
          # 0001-0032 predate this convention and are intentionally exempt
          # (see .claude/CLAUDE.md "Forward-fix plan") — editing one of them
          # must not start failing CI.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          else
            # push/workflow_dispatch: compare against the previous commit.
            base="HEAD^"
          fi

          new_migrations=$(git diff --name-only --diff-filter=A "$base" HEAD \
            -- 'supabase/migrations/*.sql')

          if [ -z "$new_migrations" ]; then
            echo "No new migrations in this change."
            exit 0
          fi

          missing=""
          for file in $new_migrations; do
            has_class=false
            has_window=false
            grep -qE '^--[[:space:]]*Forward-fix:[[:space:]]*(additive|destructive|replace)\b' "$file" \
              && has_class=true
            # Window: states what happens to the already-deployed code while the
            # new schema is live and the new image is not — see .claude/CLAUDE.md
            # "The ordering guarantee". Must say something, not just exist.
            grep -qE '^--[[:space:]]*Window:[[:space:]]*[^[:space:]<]' "$file" \
              && has_window=true

            if $has_class && $has_window; then
              echo "OK   $file"
            else
              $has_class || echo "FAIL $file — no valid 'Forward-fix:' class"
              $has_window || echo "FAIL $file — no filled-in 'Window:' line"
              missing="$missing $file"
            fi
          done

          if [ -n "$missing" ]; then
            cat <<'EOF'

          Every new migration must document a forward-fix plan in its SQL
          comment header. Add a block like:

            -- Forward-fix: additive
            --   Rollback: drop table if exists public.<table>;
            --   Data:     no data loss
            --   Blast:    <what breaks between the bad deploy and the fix>
            --   Window:   compatible

          The class must be one of: additive, destructive, replace.

          Window: is about DEPLOY ORDER, not about a bad migration. Schema is
          applied minutes before the new image ships (deploy-prod.yml step 1 vs
          step 4), so the migration has to be backward-compatible with the code
          already running. A new mandatory column without a default, or a
          rename/drop of a column a deployed page selects, is NOT safe in one
          release — split it expand/contract. "compatible" is a valid answer
          for most additive migrations; a placeholder in <angle brackets> is not.

          See .claude/CLAUDE.md -> "Forward-fix plan" and "The ordering
          guarantee" for the full convention.
          EOF
            echo "Missing forward-fix block:$missing"
            exit 1
          fi

  rpc-return-shape:
    name: RPC return-shape check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the base-ref diff below can resolve.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check no RPC silently drops a jsonb return key
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          else
            # push/workflow_dispatch: compare against the previous commit.
            base="HEAD^"
          fi

          node scripts/check-rpc-shape.mjs "$base" HEAD

  guc-transaction-local:
    name: Transaction-local app.* GUCs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Whole-tree scan, so no base-ref diff and no fetch-depth needed
      # (unlike the RPC return-shape check above, which has to compare two
      # versions of the same function). ADR-0003 rule 5: an `app.*` GUC set
      # session-scoped survives its transaction on a pooled PostgREST
      # connection and misapplies tenant scoping to a later request.
      - name: Check every app.* GUC is set transaction-locally
        run: node scripts/check-guc-transaction-local.mjs

  migration-snapshot-warning:
    name: Migration snapshot (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so the merge-base diff below can resolve.
          fetch-depth: 0

      - name: Warn about destructive migrations with no snapshot (REL-04)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # ADVISORY ONLY — this step never fails the build, by design.
          #
          # The blocking gate lives in deploy-prod.yml, and it has to: only
          # prod's own migration ledger knows which migrations are actually
          # pending, and a snapshot has to be taken immediately before the
          # push to be worth anything (one taken at PR time is stale by the
          # time the PR merges). Neither fact is knowable here.
          #
          # What this step is for is timing. Without it the first sign that
          # a destructive migration has no snapshot is a failed prod deploy,
          # which is where it was found on 2026-09-11. Surfacing it on the
          # PR costs nothing and moves that discovery days earlier.
          #
          # Only ADDED files (--diff-filter=A), same as the forward-fix and
          # sort-order jobs: editing an existing migration's body must not
          # start warning about it.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          else
            base="HEAD^"
          fi

          new_migrations=$(git diff --name-only --diff-filter=A "$base" HEAD \
            -- 'supabase/migrations/*.sql')

          if [ -z "$new_migrations" ]; then
            echo "No new migrations in this change."
            exit 0
          fi

          pending=""
          for file in $new_migrations; do
            grep -qE '^--[[:space:]]*Forward-fix:[[:space:]]*destructive\b' "$file" || continue

            if scripts/check-snapshot-claim.sh "$file"; then
              : # message already printed by the script
            else
              pending="$pending $file"
            fi
          done

          if [ -n "$pending" ]; then
            cat <<'EOF'

          NOTE — not a failure. One or more destructive migrations in this PR
          reference no prod snapshot and claim no constraint-only exemption.
          The prod deploy WILL block on this later (deploy-prod.yml, REL-04).

          Before cutting the release, either run
            scripts/ops/snapshot-prod-db.sh <migration version>
          and paste the printed filename into that migration's 'Data:' line, or
          — if it writes no rows at all — claim the verified exemption:
            -- Data:     no snapshot required (constraint-only): <why>

          Deliberately advisory: the snapshot must be taken immediately before
          the push to be useful, so taking one now would go stale anyway.
          EOF
          fi

  migration-number-collision:
    name: Migration number collision
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for duplicate migration number prefixes
        run: |
          set -euo pipefail

          # supabase db push matches migrations by their numeric prefix, not
          # filename. Two files sharing a prefix silently skip one as
          # "up to date" instead of erroring — this is what actually caused
          # F-REL-09 (see .claude/CLAUDE.md "Migration naming").
          #
          # Migrations written after 2026-09-08 use the Supabase CLI's
          # YYYYMMDDHHMMSS timestamp format instead of sequential 00NN
          # numbers (see .claude/CLAUDE.md "Migration naming"), which in
          # practice can't collide. This check stays anyway: the regex below
          # matches both formats (any leading digit run), so it still catches
          # an accidental reused 00NN prefix among the 58 legacy files, which
          # are never renamed.
          cd supabase/migrations

          duplicates=$(ls -1 *.sql \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort | uniq -d)

          if [ -n "$duplicates" ]; then
            echo "Duplicate migration number prefixes found:"
            for num in $duplicates; do
              echo ""
              echo "  $num:"
              ls -1 "${num}"_*.sql | sed 's/^/    /'
            done
            echo ""
            echo "supabase db push matches migrations by numeric prefix, not filename."
            echo "A collision causes one migration to be silently skipped instead of applied."
            echo "Renumber the newer migration to a free prefix."
            exit 1
          fi

          echo "No migration number collisions."

      - name: Check new migrations sort above base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # supabase db push refuses to apply a migration whose prefix sorts
          # below the highest version already recorded for that environment
          # (see .claude/CLAUDE.md "Ordering hazard"). A PR that was green
          # against an older main can still land a migration with a prefix
          # that sorts below one merged in the meantime — this check re-runs
          # on every push to the head branch, so it only catches that if
          # "require branches to be up to date before merging" is also
          # enabled; without that setting this step can go stale the same
          # way the PR it's meant to catch does.
          #
          # Only ADDED files count (--diff-filter=A), same as the forward-fix
          # job above — editing an existing 00NN file's body must not trip
          # this, and legacy 00NN prefixes always sort below every timestamp
          # prefix anyway, so they can't threaten the floor.
          if [ -n "${BASE_SHA:-}" ]; then
            base="$BASE_SHA"
          else
            base="HEAD^"
          fi

          new_migrations=$(git diff --name-only --diff-filter=A "$base" HEAD \
            -- 'supabase/migrations/*.sql')

          if [ -z "$new_migrations" ]; then
            echo "No new migrations in this change."
            exit 0
          fi

          floor=$(git show "$base:supabase/migrations" 2>/dev/null \
            | grep -E '\.sql$' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | awk '{ printf "%020d\n", $0 }' \
            | sort | tail -1)
          floor="${floor:-00000000000000000000}"

          echo "Highest migration prefix on base branch (padded): $floor"

          failed=""
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            prefix=$(basename "$file" | sed -E 's/^([0-9]+)_.*/\1/')
            # Pad to compare 00NN prefixes against timestamp prefixes.
            padded_prefix=$(printf '%020d' "$prefix")
            if [ "$(printf '%s\n%s\n' "$padded_prefix" "$floor" | sort | tail -1)" != "$padded_prefix" ]; then
              echo "FAIL $file — prefix $prefix does not sort above base branch floor"
              failed="$failed $file"
            else
              echo "OK   $file — prefix $prefix"
            fi
          done <<< "$new_migrations"

          if [ -n "$failed" ]; then
            cat <<EOF

          One or more new migrations sort below the highest migration prefix
          already on main. supabase db push will silently skip them instead
          of applying them (this is what caused F-REL-09).

          Rebase onto the latest main and regenerate the migration filename
          with 'supabase migration new <name>' so its timestamp sorts above
          the current floor.
          EOF
            exit 1
          fi

          echo "All new migrations sort above the base branch floor."

  build:
    name: Production build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build
        env:
          # Dummy values: NEXT_PUBLIC_* vars are inlined into the client
          # bundle at build time and must be present for prerender to
          # succeed (see F-MNT-07), but their real values are only needed
          # at runtime, not to verify the build itself.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
