name: "ISO 25010: CodeQL SAST Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # also allow manual trigger from GitHub UI
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze Source Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to write to the GitHub Security tab

    strategy:
      fail-fast: false
      matrix:
        # CodeQL analyzes these languages in your Next.js + Supabase stack
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initialize the CodeQL tool
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # "security-extended" finds more hidden vulnerabilities, ideal for ISO requirements
        queries: security-extended

    # Since Next.js (JavaScript/TypeScript) doesn't need compiling
    # in the traditional sense, CodeQL handles the analysis fully automatically here.
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    # Perform the actual security analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
